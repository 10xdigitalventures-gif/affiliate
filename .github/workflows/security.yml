name: Security Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 02:00 UTC to catch newly-published CVEs.
    - cron: '0 2 * * 1'

jobs:
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Only scan application source; skip generated files and node_modules.
          config: |
            paths:
              - backend/src
              - web
            paths-ignore:
              - backend/node_modules
              - web/node_modules
              - backend/dist
              - web/.next

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  trivy:
    name: Trivy vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          # Block the workflow on CRITICAL and HIGH findings.
          # Adjust to 'CRITICAL' only if the noise is too high initially.
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        # Always upload so results appear even when the scan finds issues.
        if: always()
        with:
          sarif_file: trivy-results.sarif
