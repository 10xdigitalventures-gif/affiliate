name: Accessibility (axe-core)

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/a11y.yml'

jobs:
  axe:
    name: WCAG 2.1 AA audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/v1
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci

      - name: Start Next.js server
        run: npx next start -p 3000 &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/v1
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && break
            echo "Waiting for Next.js... ($i/30)"
            sleep 2
          done

      - name: Run axe-core audit
        run: |
          axe http://localhost:3000 \
               http://localhost:3000/login \
               --exit \
               --tags wcag2a,wcag2aa \
               --reporter json \
               --save axe-results.json || true

      - name: Check for critical violations
        run: |
          node -e "
            const r = require('./axe-results.json');
            const violations = r.flatMap(p => p.violations)
              .filter(v => ['critical','serious'].includes(v.impact));
            if (violations.length > 0) {
              console.error('WCAG violations found:');
              violations.forEach(v => console.error(' -', v.id, v.impact, v.description));
              process.exit(1);
            }
            console.log('No critical/serious WCAG violations found.');
          "

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: web/axe-results.json
