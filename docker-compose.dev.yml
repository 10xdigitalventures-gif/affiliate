# Dev override — only starts infrastructure (Postgres + Redis)
# Use: docker compose -f docker-compose.dev.yml up -d
# Then run backend and frontend locally with npm run start:dev / npm run dev

version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: affiliate_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: affiliate_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: affiliate_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # Optional: catch emails locally (http://localhost:1080)
  mailcatcher:
    image: schickling/mailcatcher
    container_name: affiliate_mailcatcher
    ports:
      - '1080:1080'
      - '1025:1025'

volumes:
  postgres_data:
  redis_data:
