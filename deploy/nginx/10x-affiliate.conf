# Nginx reverse proxy for the 10x Affiliate platform.
# TLS is terminated by Cloudflare (tunnel); Nginx listens on plain HTTP :80 as
# the LOCAL ORIGIN cloudflared connects to. Do NOT expose :80 publicly.
#
# Install:
#   sudo cp deploy/nginx/10x-affiliate.conf /etc/nginx/sites-available/10x-affiliate.conf
#   sudo ln -s /etc/nginx/sites-available/10x-affiliate.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# MentoringHub production domains are already filled in below.

# Marketing website -> :3002
server {
    listen 80;
    server_name web.mentoringhub.online;
    real_ip_header CF-Connecting-IP;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Affiliate dashboard/portal (:3100) + API (/v1 -> :4100)
server {
    listen 80;
    server_name affiliate.mentoringhub.online;
    real_ip_header CF-Connecting-IP;
    client_max_body_size 10m;

    location /v1/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
