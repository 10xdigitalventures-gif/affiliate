# Cloudflare Tunnel (cloudflared) config for the 10x Affiliate platform.
# One named tunnel serves all hostnames; each ingress points at local Nginx :80.
# Cloudflare handles public TLS automatically - no certbot needed.
#
# Setup:
#   cloudflared tunnel login
#   cloudflared tunnel create 10x-affiliate     # prints UUID + /root/.cloudflared/<UUID>.json
#   sudo mkdir -p /etc/cloudflared && sudo cp /root/.cloudflared/<UUID>.json /etc/cloudflared/
#   cloudflared tunnel route dns 10x-affiliate 10xaffiliate.com
#   cloudflared tunnel route dns 10x-affiliate www.10xaffiliate.com
#   cloudflared tunnel route dns 10x-affiliate app.10xaffiliate.com
#   sudo cp deploy/cloudflared/config.yml /etc/cloudflared/config.yml
#   sudo cloudflared service install && sudo systemctl restart cloudflared
#
# Edit: set credentials-file to the real <UUID>.json path; use your real domains.

tunnel: 10x-affiliate
credentials-file: /etc/cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: 10xaffiliate.com
    service: http://localhost:80
  - hostname: www.10xaffiliate.com
    service: http://localhost:80
  - hostname: app.10xaffiliate.com
    service: http://localhost:80
  - service: http_status:404
