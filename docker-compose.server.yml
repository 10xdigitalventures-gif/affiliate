name: mentoringhub-affiliate

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.server}
    volumes:
      - affiliate_redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  migration:
    profiles: ["tools"]
    image: ${AFFILIATE_IMAGE_PREFIX:-mentoringhub-affiliate}-backend-tools:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: tools
    env_file: [./backend/.env]
    environment:
      NODE_ENV: production
    command: ["sh", "-c", "npm run db:prepare && npx prisma migrate deploy"]
    networks: [internal]
    restart: "no"
    logging: *default-logging

  admin-bootstrap:
    profiles: ["tools"]
    image: ${AFFILIATE_IMAGE_PREFIX:-mentoringhub-affiliate}-backend-tools:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: tools
    env_file: [./backend/.env]
    command: ["npm", "run", "admin:ensure"]
    networks: [internal]
    restart: "no"
    logging: *default-logging

  backend:
    image: ${AFFILIATE_IMAGE_PREFIX:-mentoringhub-affiliate}-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    env_file: [./backend/.env]
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4100
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.server}
    depends_on:
      redis:
        condition: service_healthy
    ports: ["127.0.0.1:4100:4100"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  web:
    image: ${AFFILIATE_IMAGE_PREFIX:-mentoringhub-affiliate}-web:${IMAGE_TAG:-latest}
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://affiliate.mentoringhub.online/v1}
        API_PROXY_URL: http://backend:4100
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    ports: ["127.0.0.1:3100:3000"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(r.status>=500)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  marketing:
    image: ${AFFILIATE_IMAGE_PREFIX:-mentoringhub-affiliate}-marketing:${IMAGE_TAG:-latest}
    build:
      context: ./marketing
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_APP_URL:-https://affiliate.mentoringhub.online}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://affiliate.mentoringhub.online}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3002:3000"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

networks:
  internal:
    driver: bridge

volumes:
  affiliate_redis_data:
